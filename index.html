<!Doctype html>
<html lang="en">
<head>
    <title>Electrical Homepage</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--include css for footer and header-->
    <link  rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    

</head>
<body>

    <!--header-->
    <section>
    <div class="hero-content" id="header-container"></div>
    </section>


    <!--Contents Page-->
    <section class="hero hero-welcome">
        <div class="hero-content">
           
            <h2><span class="italic">Lab 1, </span> <span class="welcome">WELCOME</span></h2>
        </div>
    </section>


    <!--image sliders if clicked will navigate to tv.html page-->

    <section class="features">
        <h3>Features</h3>
        <div class="slider">
            <div class="slides">
            <a href="tv.html"><img src="./images/tv_1.png" alt="TV Feature 1"></a>
            <a href="tv.html"><img src="images/tv5.png" alt="TV Feature 2"></a>
            <a href="tv.html"><img src="images/tv3.jpg" alt="TV Feature 3"></a>
            </div>
        </div>
     </section>

    <!---footer-->
    <section>
    <div  class="hero-content" id="footer-container"></div>
    </section>

    
        <script>

       function loadComponent(id,file){
        fetch(file).then(response=> response.text()).then(data=>
            { document.getElementById(id).innerHTML=data;

            }
        )
        .catch(err=>console.eror(`Error Loading ${file}:`,err));
       }

       //load header and footer
       document.addEventListener('DOMContentLoaded', function(){
        loadComponent('header-container', './header.html');
        loadComponent('footer-container', './footer.html');
       });

       
    




        </script>

         <script src="js/script.js"></script>



</body>
</html>
